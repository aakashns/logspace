# Checks platform2, the Bun + Effect + Datastar rewrite of the app, and builds and smoke-tests its
# binary on each platform. It isn't released.
name: platform2

on:
  pull_request:
    paths: ['platform2/**', '.github/workflows/platform2.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: platform2/package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: platform2/package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/smoke-test.ts dist/logspace
